name: Feature request
description: Suggest an action, a Studio improvement or something else
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to automate?
      description: Describe the task in your own words. Which programs, files or websites are involved?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AutoFlowMate help?
      description: A new action, a new field, a change in Studio...
  - type: textarea
    id: now
    attributes:
      label: How do you do it today?
