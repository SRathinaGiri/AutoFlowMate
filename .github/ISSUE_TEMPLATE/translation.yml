    id: language
    attributes:
      label: Language
      placeholder: हिन्दी (Hindi)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Attach your lang/<code>.json, or open a pull request with it (see CONTRIBUTING.md).
