name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Validate example flows
        shell: pwsh
        run: |
          Get-ChildItem examples -Filter *.json | ForEach-Object {
            .\target\debug\autoflow.exe validate $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "invalid example: $($_.Name)" }
          }

      - name: Generated schema and action reference are up to date
        shell: pwsh
        run: |
          .\target\debug\autoflow.exe schema -o schema/flow.schema.json
          .\target\debug\autoflow.exe docs -o skills/autoflowmate/references/actions.md
          git diff --exit-code -- schema/flow.schema.json skills/autoflowmate/references/actions.md
          if ($LASTEXITCODE -ne 0) { throw "run 'autoflow schema' and 'autoflow docs' and commit the result" }

  # Every dependency must have a permissive licence (no GPL/LGPL/AGPL/MPL); see deny.toml.
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
