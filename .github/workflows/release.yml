name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build and publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab (it then only builds and uploads the zip as an artifact,
# unless you tick "publish").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create the GitHub release for the version in Cargo.toml'
        type: boolean
        default: false

permissions:
  contents: write
  # Signed build provenance: anyone can check a download came from this workflow and commit
  # (gh attestation verify <zip> --repo SRathinaGiri/AutoFlowMate).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v (expected $tag)"
          }
          $gemini = (Get-Content gemini-extension.json -Raw | ConvertFrom-Json).version
          if ($gemini -ne $v) { throw "gemini-extension.json version $gemini does not match Cargo.toml version $v" }
          $claude = (Get-Content skills/autoflowmate/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ($claude -ne $v) { throw "skills/autoflowmate/.claude-plugin/plugin.json version $claude does not match Cargo.toml version $v" }
          $agy = (Get-Content .antigravity-plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ($agy -ne $v) { throw ".antigravity-plugin/plugin.json version $agy does not match Cargo.toml version $v" }
          # Releases are immutable: a published version is never rebuilt or replaced. Changed
          # binaries need a new version and tag. Checked before building, so nothing is wasted.
          $publishing = $env:GITHUB_REF_TYPE -eq 'tag' -or $env:PUBLISH -eq 'true'
          if ($publishing) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; releases are never replaced. Bump the version for a new release." }
            $tagSha = git ls-remote origin "refs/tags/$tag^{}" | ForEach-Object { ($_ -split '\s+')[0] }
            if (-not $tagSha) { $tagSha = git ls-remote origin "refs/tags/$tag" | ForEach-Object { ($_ -split '\s+')[0] } }
            if ($tagSha -and $tagSha -ne $env:GITHUB_SHA) { throw "Tag $tag points to $tagSha, but this run builds $env:GITHUB_SHA" }
          }
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, tag $tag"

      - name: Test
        run: cargo test --workspace --locked --release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Agent plugin package (ChatGPT / Codex)
        shell: pwsh
        run: ./scripts/package-plugin.ps1

      - name: Attest build provenance
        if: github.ref_type == 'tag' || inputs.publish
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoFlowMate-${{ steps.version.outputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $notes = ".github/release-notes/$env:TAG.md"
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          $ghArgs = @($env:TAG) + $files + @('--title', "AutoFlowMate $env:TAG", '--target', $env:GITHUB_SHA)
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          # Never upload over an existing release (checked again here in case one appeared meanwhile).
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists; releases are never replaced" }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
