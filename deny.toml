# cargo-deny policy, checked by CI on every push and pull request:
#   cargo deny check licenses bans sources
# AutoFlowMate is MIT. Dependencies must use permissive licences only, so anyone can use,
# change and ship it, including commercially. Copyleft licences (GPL, LGPL, AGPL, MPL, EUPL...)
# are not allowed. Adding a licence here needs the maintainer's agreement in the pull request.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Fonts bundled by egui (data, not code).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Our own crates are not published to crates.io.
[licenses.private]
ignore = true

# Approved by the maintainer (2026-11-20): auto_generate_cdp is GPL-3.0, but it is only a
# build-time code generator for headless_chrome (MIT). It runs while compiling to write the
# Chrome DevTools bindings; none of its own code is linked into AutoFlowMate. This is the only
# exception: no other GPL or copyleft crate may be added.
[[licenses.exceptions]]
crate = "auto_generate_cdp"
allow = ["GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
