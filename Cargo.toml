[workspace]
resolver = "2"
members = ["crates/autoflow-core", "crates/autoflow-cli", "crates/autoflow-gui"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/SRathinaGiri/AutoFlowMate"

[workspace.dependencies]
autoflow-core = { path = "crates/autoflow-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
chrono = "0.4"
glob = "0.3"
enigo = "0.6"
uiautomation = "0.25"
arboard = "3"
xcap = "0.9"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
rfd = "0.18"
headless_chrome = "1"
calamine = { version = "0.38", features = ["dates"] }
csv = "1"
pdf-extract = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
keyring = { version = "3", features = ["windows-native"] }
rpassword = "7"
ureq = { version = "3", features = ["json", "charset"] }
rust_xlsxwriter = "0.103"
regex = "1"
fasteval = "0.2"
imap = "=3.0.0-alpha.15"
mail-parser = "1"
odbc-api = { version = "30", default-features = false, features = ["odbc_version_3_80"] }
rusqlite = { version = "0.43", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
lopdf = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Integer overflow in AutoFlowMate's own code is a bug: stop with an error instead of silently
# wrapping, also in release builds (the cost is negligible).
[profile.release.package.autoflow-core]
overflow-checks = true
